server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent stale caching of SPA/PWA assets
    location ~* (sw\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Reverse proxy Firebase Auth handler to app's own domain
    location /__/auth/ {
        proxy_pass https://iron-hope-shop-ff854.firebaseapp.com/__/auth/;
        proxy_set_header Host iron-hope-shop-ff854.firebaseapp.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
