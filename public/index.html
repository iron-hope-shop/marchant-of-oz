<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant of Oz</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .container {
      text-align: center;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      max-width: 420px;
      width: 90%;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
    }
    p {
      margin: 0 0 1.5rem 0;
      color: #64748b;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #f3f4f6;
    }
    .btn-signout {
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      margin-top: 1rem;
    }
    .btn-signout:hover {
      background-color: #dc2626;
    }
    .user-profile {
      display: none;
      margin-top: 1.5rem;
      text-align: center;
    }
    .user-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin-bottom: 0.5rem;
    }
    .status-msg {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #dc2626;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

    // Same-origin reverse-proxy configuration prevents Safari ITP / cross-origin popup blocks
    const firebaseConfig = {
      apiKey: "AIzaSyCAB2x8toj3IHlfHCSEEglVx9pJdZMU9QE",
      authDomain: window.location.host, // Points to current origin via /__/auth/ Nginx proxy
      projectId: "iron-hope-shop-ff854",
      storageBucket: "iron-hope-shop-ff854.firebasestorage.app",
      messagingSenderId: "148109111215",
      appId: "1:148109111215:web:208f61c9b7d974e064095a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginSection = document.getElementById("login-section");
    const userProfile = document.getElementById("user-profile");
    const userName = document.getElementById("user-name");
    const userEmail = document.getElementById("user-email");
    const userAvatar = document.getElementById("user-avatar");
    const statusMsg = document.getElementById("status-msg");
    const signInBtn = document.getElementById("signin-btn");
    const signOutBtn = document.getElementById("signout-btn");

    signInBtn.addEventListener("click", async () => {
      statusMsg.textContent = "";
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error(err);
        statusMsg.textContent = err.message;
      }
    });

    signOutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (err) {
        console.error(err);
        statusMsg.textContent = err.message;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = "none";
        userProfile.style.display = "block";
        userName.textContent = user.displayName || "User";
        userEmail.textContent = user.email || "";
        userAvatar.src = user.photoURL || "";
      } else {
        loginSection.style.display = "block";
        userProfile.style.display = "none";
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <h1>Merchant of Oz</h1>
    <p>Google Cloud Run (iron-hope-shop-ff854)</p>

    <div id="login-section">
      <button id="signin-btn" class="btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.547 0 9s.347 2.827.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <div id="user-profile" class="user-profile">
      <img id="user-avatar" class="user-avatar" alt="Avatar">
      <h3 id="user-name" style="margin: 0.25rem 0;"></h3>
      <p id="user-email" style="margin: 0 0 1rem 0; font-size: 0.875rem;"></p>
      <button id="signout-btn" class="btn btn-signout">Sign Out</button>
    </div>

    <div id="status-msg" class="status-msg"></div>
  </div>
</body>
</html>
